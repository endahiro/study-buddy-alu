[project]
name = "studybuddy"
version = "1.0.0"
description = "A terminal-native, Socratic-first AI coding tutor that debugs your code and teaches the concepts behind the fix."
readme = "README.md"
requires-python = ">=3.10"
# DESIGN: the Ollama SDK is a core dependency because free local models are the default;
# that keeps installing to one command. Paid providers stay optional extras.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ollama>=0.6.3",
    "httpx>=0.27",
]

[project.scripts]
studybuddy = "studybuddy.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.9.0",
]
gemini = [
    "google-genai>=2.25.0",
]
# Kept so older install commands with [ollama] still work; it's now a core dependency.
ollama = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studybuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "studybuddy.llm.*"
strict = true
